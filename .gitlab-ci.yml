stages:
  - build
  - test

variables:
  SECURE_LOG_LEVEL: "debug"

# Utilización de imágenes oficiales específicas y seguras (Pinning por versión exacta)
image: python:3.10.12-slim

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip
    - venv/

build-and-lint:
  stage: build
  script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install --cache-dir=.cache/pip mypy
    - mypy src/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

unit-tests:
  stage: test
  script:
    - source venv/bin/activate
    - pip install --cache-dir=.cache/pip pytest pytest-cov
    - pytest test/ --junitxml=unit_test_results.xml --cov=src/
    # Inyección segura del token mediante Variables Protegidas de GitLab CI/CD (Nunca hardcodeado)
    - bash codecov_script.sh
  artifacts:
    name: "test-results-$CI_COMMIT_SHORT_SHA"
    reports:
      junit: unit_test_results.xml
    expire_in: 30 days
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: build
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
