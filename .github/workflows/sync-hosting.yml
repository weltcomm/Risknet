name: Sincronización Automática RiskNet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar Dependencias
        run: npm install

      - name: 🏗️ Compilar Frontend con Vite
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: 🚀 Desplegar a Hosting vía SSH / Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzP --delete --exclude='.git*' --exclude='node_modules'"
          SERVER_HOST: ${{ secrets.HOST_IP }}
          SERVER_USER: ${{ secrets.HOST_USERNAME }}
          TARGET: ${{ secrets.HOST_APP_PATH }}

      - name: 🔄 Reiniciar Aplicación Node.js en Hosting
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.HOST_APP_PATH }}
            npm install --omit=dev
            if command -v pm2 > /dev/null; then
              pm2 restart risknet || pm2 start server.ts --name risknet --interpreter ts-node
            elif [ -f tmp/restart.txt ]; then
              touch tmp/restart.txt
            fi
